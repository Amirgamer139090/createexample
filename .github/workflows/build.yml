name: Build Mod

# Runs automatically on every push to main, on pull requests,
# and manually from the Actions tab ("Run workflow" button).
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Restores the Gradle / NeoForm / Create dependency cache between runs,
      # so only the FIRST build is slow (~10 min); later ones take ~2-3 min.
      - name: Setup Gradle with caching
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      # Makes the compiled jar downloadable from the Actions run page.
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: createexample-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
