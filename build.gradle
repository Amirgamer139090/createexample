plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}
group = project.mod_group_id
version = project.mod_version
base { archivesName = project.mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.createmod.net' }
}
dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    // Create integration is intentionally deferred until its exact compatible
    // artifact/version is verified. Do not add guessed coordinates here.
}
runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'info'
        modSource project.sourceSets.main
    }
    client { }
    server { }
    gameTestServer { }
    data {
        programArguments.addAll '--mod', mod_id, '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
    }
}
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    // Temporary cleanup guard: legacy createexample resources are pending
    // deletion from the repository; keep them out of the built jar.
    exclude 'assets/createexample/**'
    exclude 'data/createexample/**'
    exclude 'data/minecraft/**'
}
